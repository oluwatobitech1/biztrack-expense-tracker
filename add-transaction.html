<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="style.css" />

        <span class="sidebar-brand-mark">B</span>
        <span class="sidebar-brand-name">BizTrack</span>
      </div>

      <div class="sidebar-business">
        <span class="sidebar-business-initial" data-business-initial>B</span>
        <div>
          <div class="sidebar-business-name" data-business-name>Your Business</div>
          <div class="sidebar-business-type" data-business-type></div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" data-nav-link="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>
          Dashboard
        </a>
        <a href="transactions.html" data-nav-link="transactions">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          Transactions
        </a>
        <a href="add-transaction.html" data-nav-link="add">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Add Transaction
        </a>
        <a href="reports.html" data-nav-link="reports">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>
          Reports
        </a>
        <a href="settings.html" data-nav-link="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Settings
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1 id="form-heading">Add Income</h1>
          <p class="page-subtitle">Fill in the details below.</p>
        </div>
      </div>

      <div class="card" style="max-width: 560px;">
        <div class="type-toggle">
          <button type="button" class="type-toggle-btn" data-type="income">Income</button>
          <button type="button" class="type-toggle-btn" data-type="expense">Expense</button>
        </div>

        <form id="transaction-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="amount-input">Amount</label>
            <div class="amount-input-wrap">
              <span class="currency-prefix">₦</span>
              <input type="number" id="amount-input" class="form-input" placeholder="0.00" min="0" step="0.01" />
            </div>
            <div class="form-error" id="amount-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="description-input">Description</label>
            <input type="text" id="description-input" class="form-input" placeholder="e.g. Customer payment" />
            <div class="form-error" id="description-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Category</label>
            <div class="category-grid" id="category-grid"></div>
            <div class="form-error" id="category-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="payment-method-select">Payment Method</label>
            <select id="payment-method-select" class="form-select"></select>
            <div class="form-error" id="payment-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="date-input">Date</label>
            <input type="date" id="date-input" class="form-input" />
            <div class="form-error" id="date-error"></div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
            <button type="submit" class="btn btn-primary btn-block" id="save-btn">Save Income</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <nav class="mobile-nav">
    <a href="dashboard.html" data-nav-link="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>
      Home
    </a>
    <a href="transactions.html" data-nav-link="transactions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Transactions
    </a>
    <a href="add-transaction.html" class="mobile-nav-add" data-nav-link="add">
      <span class="mobile-nav-add-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <span>Add</span>
    </a>
    <a href="reports.html" data-nav-link="reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>
      Reports
    </a>
    <a href="settings.html" data-nav-link="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script src="transaction-form.js"></script>
</body>
</html>
