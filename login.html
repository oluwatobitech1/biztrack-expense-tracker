<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — BizTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="animations.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

  <div class="setup-shell">
    <div class="card setup-card auth-card">
      <img class="auth-logo" src="logo-mark.png" alt="BizTrack logo" />
      <span class="auth-badge"><span class="dot"></span> <span data-i18n="auth.welcomeBack">Welcome back</span></span>
      <h1 data-i18n="auth.signInTitle">Sign in to BizTrack.</h1>
      <p class="auth-sub" data-i18n="auth.signInSub">Pick up right where you left off.</p>

      <div class="auth-error-banner" id="login-error-banner"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-username-input" data-i18n="auth.usernameLabel">Username</label>
          <input type="text" id="login-username-input" class="form-input" placeholder="Enter your username" data-i18n-placeholder="auth.usernamePlaceholderLogin" autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-pin-input" data-i18n="auth.pinLabel">PIN</label>
          <input type="password" id="login-pin-input" class="form-input" placeholder="••••" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" data-i18n-placeholder="auth.pinPlaceholder" />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn" data-i18n="auth.signInBtn">Sign in →</button>
      </form>

      <p class="auth-footer-link"><a href="recover.html" data-i18n="auth.forgotPin">Forgot your PIN?</a></p>
      <p class="auth-footer-link"><span data-i18n="auth.noAccount">Don't have an account?</span> <a href="signup.html" data-i18n="auth.createOne">Create one</a></p>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="login.js"></script>
  <script src="animate.js"></script>
</body>
</html>
