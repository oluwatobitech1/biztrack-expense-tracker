<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — BizTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="animations.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

  <div class="setup-shell">
    <div class="card setup-card auth-card">
      <img class="auth-logo" src="logo-mark.png" alt="BizTrack logo" />
      <span class="auth-badge"><span class="dot"></span> Welcome back</span>
      <h1>Sign in to BizTrack.</h1>
      <p class="auth-sub">Pick up right where you left off.</p>

      <div class="auth-error-banner" id="login-error-banner"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-username-input">Username</label>
          <input type="text" id="login-username-input" class="form-input" placeholder="Enter your username" autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password-input">Password</label>
          <input type="password" id="login-password-input" class="form-input" placeholder="Enter your password" autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">Sign in →</button>
      </form>

      <p class="auth-footer-link">Don't have an account? <a href="signup.html">Create one</a></p>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script src="login.js"></script>
  <script src="animate.js"></script>
</body>
</html>
