<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set up your business — BizTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

  <div class="setup-shell">
    <div class="card setup-card">
      <img class="auth-logo" src="logo-mark.png" alt="BizTrack logo" />
      <div class="setup-progress">
        <div class="setup-progress-dot" id="progress-dot-1"></div>
        <div class="setup-progress-dot" id="progress-dot-2"></div>
      </div>

      <div class="setup-step is-active" id="setup-step-1">
        <h2>What's your business called?</h2>
        <p class="setup-sub">This is how it'll show up across your dashboard.</p>

        <div class="form-group">
          <label class="form-label" for="business-name-input">Business name</label>
          <input type="text" id="business-name-input" class="form-input" placeholder="e.g. Tobi Fashion" autocomplete="organization" />
          <span class="form-error" id="business-name-error"></span>
        </div>

        <button type="button" class="btn btn-primary btn-block" id="setup-continue-btn">Continue →</button>
      </div>

      <div class="setup-step" id="setup-step-2">
        <h2>What kind of business is it?</h2>
        <p class="setup-sub">We'll tailor your categories to match.</p>

        <div class="business-type-grid">
          <div class="business-type-option" data-type="Retail">Retail</div>
          <div class="business-type-option" data-type="Service">Service</div>
          <div class="business-type-option" data-type="Food & Drink">Food & Drink</div>
          <div class="business-type-option" data-type="Freelance">Freelance / Other</div>
        </div>

        <div style="display:flex; gap: 10px;">
          <button type="button" class="btn btn-secondary" id="setup-back-btn">Back</button>
          <button type="button" class="btn btn-primary btn-block" id="setup-finish-btn" disabled>Finish setup</button>
        </div>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="setup.js"></script>
</body>
</html>
