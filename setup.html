<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set up your business — BizTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="setup-shell">
    <div class="card setup-card">
      <div class="setup-progress">
        <div class="setup-progress-dot" id="progress-dot-1"></div>
        <div class="setup-progress-dot" id="progress-dot-2"></div>
      </div>

      <div class="setup-step is-active" id="setup-step-1">
        <h2>Welcome to BizTrack 👋</h2>
        <p class="setup-sub">Let's set up your business in a few seconds.</p>

        <div class="form-group">
          <label class="form-label" for="business-name-input">What's your business name?</label>
          <input type="text" id="business-name-input" class="form-input" placeholder="Enter business name" autocomplete="off" />
          <div class="form-error" id="business-name-error">Please enter your business name.</div>
        </div>

        <button class="btn btn-primary btn-block" id="setup-continue-btn">Continue</button>
      </div>

      <div class="setup-step" id="setup-step-2">
        <h2>What type of business do you run?</h2>
        <p class="setup-sub">This helps us tailor your categories.</p>

        <div class="business-type-grid">
          <div class="business-type-option" data-type="Fashion">Fashion</div>
          <div class="business-type-option" data-type="Food">Food</div>
          <div class="business-type-option" data-type="Retail">Retail</div>
          <div class="business-type-option" data-type="Freelance">Freelance</div>
          <div class="business-type-option" data-type="Services">Services</div>
          <div class="business-type-option" data-type="Beauty">Beauty</div>
          <div class="business-type-option" data-type="Technology">Technology</div>
          <div class="business-type-option" data-type="Other">Other</div>
        </div>

        <div class="form-actions">
          <button class="btn btn-secondary" id="setup-back-btn">Back</button>
          <button class="btn btn-primary btn-block" id="setup-finish-btn" disabled>Continue</button>
        </div>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="setup.js"></script>
</body>
</html>
