<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizTrack</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1B5E42" />
</head>
<body>

  <div class="setup-shell">
    <div class="card setup-card auth-card" style="text-align:center;">
      <img class="auth-logo" src="logo-mark.png" alt="BizTrack logo" />
      <p style="color: var(--color-text-muted); margin-top: 12px;">Loading BizTrack…</p>
    </div>
  </div>

  <script src="storage.js"></script>
  <script>
    // No landing page — send people straight to where they belong.
    (async function () {
      const loggedIn = await isLoggedIn();
      if (loggedIn) {
        // bootstrapData() is only defined on pages that load a backend
        // sync script (e.g. supabase-client.js). Guard the call so a
        // page that hasn't loaded one doesn't crash and get stuck on
        // this loading screen forever.
        if (typeof bootstrapData === 'function') {
          await bootstrapData();
        }
        if (!isSetupComplete()) {
          window.location.replace('setup.html');
        } else {
          window.location.replace('dashboard.html');
        }
      } else {
        window.location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
