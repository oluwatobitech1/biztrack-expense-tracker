<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your account — BizTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="animations.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

  <div class="setup-shell">
    <div class="card setup-card auth-card">
      <div style="display:flex; justify-content:flex-end;">
        <select data-language-switcher class="form-select" style="width:auto; padding:6px 8px; font-size:0.8rem;" aria-label="Language"></select>
      </div>
      <img class="auth-logo" src="logo-mark.png" alt="BizTrack logo" />
      <span class="auth-badge"><span class="dot"></span> <span data-i18n="auth.getStartedFree">Get started — it's free</span></span>
      <h1 data-i18n="auth.createAccountTitle">Create your account.</h1>
      <p class="auth-sub" data-i18n="auth.createAccountSub">Start tracking sales, stock and cash in minutes.</p>

      <div class="auth-error-banner" id="auth-error-banner"></div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="name-input" data-i18n="auth.nameLabel">Your name</label>
          <input type="text" id="name-input" class="form-input" placeholder="Enter your full name" data-i18n-placeholder="auth.namePlaceholder" autocomplete="name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="username-input" data-i18n="auth.usernameLabel">Username</label>
          <input type="text" id="username-input" class="form-input" placeholder="Choose a username" data-i18n-placeholder="auth.usernamePlaceholder" autocomplete="username" />
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="country-select" data-i18n="auth.countryLabel">Country</label>
            <select id="country-select" class="form-select"></select>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="auth.currencyLabel">Currency</label>
            <div class="form-input" id="currency-display" style="display:flex; align-items:center; color: var(--color-text-muted);"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email-input" data-i18n="auth.emailLabel">Email address</label>
          <input type="email" id="email-input" class="form-input" placeholder="Enter your email" data-i18n-placeholder="auth.emailPlaceholder" autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password-input" data-i18n="auth.passwordLabel">Password</label>
          <input type="password" id="password-input" class="form-input" placeholder="Enter your password" data-i18n-placeholder="auth.passwordPlaceholder" autocomplete="new-password" />
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="terms-checkbox" />
          <span><span data-i18n="auth.termsAgreePrefix">I agree to the</span> <a href="terms.html" target="_blank" rel="noopener" data-i18n="auth.termsLink">Terms of Use and Privacy Policy</a></span>
        </label>

        <button type="submit" class="btn btn-primary btn-block" id="signup-submit-btn" data-i18n="auth.createAccountBtn">Create account →</button>
      </form>

      <p class="auth-footer-link"><span data-i18n="auth.haveAccount">Already have an account?</span> <a href="login.html" data-i18n="nav.signIn">Sign in</a></p>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script src="i18n.js"></script>
  <script src="signup.js"></script>
  <script>
    // Auto-suggest a language based on the chosen country, unless the
    // person has already picked a language themselves this visit.
    (function () {
      var countrySelect = document.getElementById('country-select');
      var langSwitcher = document.querySelector('[data-language-switcher]');
      var manualOverride = false;
      if (langSwitcher) {
        langSwitcher.addEventListener('change', function () { manualOverride = true; });
      }
      if (countrySelect) {
        countrySelect.addEventListener('change', function () {
          if (manualOverride) return;
          var suggested = suggestLanguageForCountry(countrySelect.value);
          setLanguage(suggested);
          if (typeof applyTranslations === 'function') applyTranslations();
        });
      }
    })();
  </script>
  <script src="animate.js"></script>
</body>
</html>
