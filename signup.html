<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your account — BizTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="animations.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>

  <div class="setup-shell">
    <div class="card setup-card auth-card">
      <img class="auth-logo" src="logo-mark.png" alt="BizTrack logo" />
      <span class="auth-badge"><span class="dot"></span> Get started — it's free</span>
      <h1>Create your account.</h1>
      <p class="auth-sub">Start tracking sales, stock and cash in minutes.</p>

      <div class="auth-error-banner" id="auth-error-banner"></div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="name-input">Your name</label>
          <input type="text" id="name-input" class="form-input" placeholder="Enter your full name" autocomplete="name" />
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="country-select">Country</label>
            <select id="country-select" class="form-select"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Currency</label>
            <div class="form-input" id="currency-display" style="display:flex; align-items:center; color: var(--color-text-muted);"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email-input">Email address</label>
          <input type="email" id="email-input" class="form-input" placeholder="Enter your email" autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password-input">Password</label>
          <input type="password" id="password-input" class="form-input" placeholder="Enter your password" autocomplete="new-password" />
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="terms-checkbox" />
          <span>I agree to the <a href="#" onclick="return false;">Terms of Use and Privacy Policy</a></span>
        </label>

        <button type="submit" class="btn btn-primary btn-block">Create account →</button>
      </form>

      <p class="auth-footer-link">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="signup.js"></script>
  <script src="animate.js"></script>
</body>
</html>
